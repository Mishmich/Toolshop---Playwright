name: Playwright Tests
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
  push:

permissions:
  contents: read
  checks: write
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      packages: write
    outputs:
      repo_lower: ${{ steps.repo.outputs.lowercase }}
    steps:
      - uses: actions/checkout@v4
      - name: Convert repo name to lowercase
        id: repo
        run: echo "lowercase=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ghcr.io/${{ steps.repo.outputs.lowercase }}:latest
          cache-from: type=registry,ref=ghcr.io/${{ steps.repo.outputs.lowercase }}:buildcache
          cache-to: type=registry,ref=ghcr.io/${{ steps.repo.outputs.lowercase }}:buildcache,mode=max

  test:
    runs-on: ubuntu-latest
    needs: build
    container:
      image: ghcr.io/${{ needs.build.outputs.repo_lower }}:latest
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
      options: --ipc=host
    env:
      DISPLAY: :99
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - name: Start Xvfb for display rendering
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 2
          echo "Display :99 started for consistent screenshot rendering"
      - name: Run Playwright tests - Smoke (push only)
        if: ${{ github.event_name == 'push' }}
        run: npx playwright test --grep '@smoke'
        continue-on-error: true
      - name: Run Playwright tests - Full suite (schedule & manual)
        if: ${{ github.event_name != 'push' }}
        run: npx playwright test
        continue-on-error: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Show report directories (diagnostic)
        run: |
          echo "Workspace listing for diagnostics:"
          pwd
          echo "playwright-report contents:"
          ls -la playwright-report || true
          echo "test-results contents:"
          ls -la test-results || true
      - name: Prepare GitHub Pages artifact
        if: ${{ !cancelled() }}
        run: |
          mkdir -p playwright-report
          if [ ! -f "playwright-report/index.html" ]; then
            cat > playwright-report/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Playwright Report</title>
            </head>
            <body>
              <h1>Playwright Report</h1>
              <p>No HTML report was generated for this run.</p>
            </body>
          </html>
          EOF
          fi
      - name: Upload Playwright Report to GitHub Pages
        if: ${{ !cancelled() }}
        uses: actions/upload-pages-artifact@v3
        with:
          path: playwright-report/

  deploy-pages:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4