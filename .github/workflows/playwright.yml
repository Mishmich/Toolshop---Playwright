name: Playwright Tests
on:
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:
    inputs:
      update_snapshots:
        description: 'Generate or update Playwright snapshots in the Docker container'
        required: false
        default: false
        type: boolean
  push:

permissions:
  contents: read
  checks: write

concurrency:
  # Serialize runs so two publishes never push to gh-pages at the same time.
  group: gh-pages-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      checks: write
    container:
      image: mcr.microsoft.com/playwright:v1.56.1-jammy
      options: --ipc=host
    env:
      DISPLAY: :99
      PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: 1
    steps:
      - uses: actions/checkout@v4
      - name: Install display server and fonts for consistent screenshot rendering
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y xvfb x11-utils fonts-dejavu-core fonts-liberation
          rm -rf /var/lib/apt/lists/*
      - name: Install npm dependencies
        run: npm ci
      - name: Start Xvfb for display rendering
        run: |
          Xvfb :99 -screen 0 1920x1080x24 > /dev/null 2>&1 &
          sleep 2
          echo "Display :99 started for consistent screenshot rendering"
      - name: Generate or update Playwright snapshots in Docker (manual)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: npx playwright test tests/UI --update-snapshots
      - name: Commit updated snapshots (manual update only)
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.update_snapshots }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tests/UI/__snapshots__
          if git diff --cached --quiet; then
            echo "No snapshot changes to commit."
          else
            git commit -m "Update Playwright Linux snapshots (CI run #${{ github.run_number }})"
            git push origin HEAD:${{ github.ref_name }}
          fi
      - name: Run Playwright tests - UI folder (push only)
        if: ${{ github.event_name == 'push' }}
        run: npx playwright test tests/UI
        continue-on-error: true
      - name: Run Playwright tests - Full suite (schedule & manual)
        if: ${{ github.event_name != 'push' }}
        run: npm test
        continue-on-error: true
      - name: Show report directories (diagnostic)
        run: |
          echo "Workspace listing for diagnostics:"
          pwd
          echo "playwright-report contents:"
          ls -la playwright-report || true
          echo "test-results contents:"
          ls -la test-results || true
      - name: Prepare GitHub Pages artifact
        if: ${{ !cancelled() }}
        run: |
          mkdir -p playwright-report
          if [ ! -f "playwright-report/index.html" ]; then
            cat > playwright-report/index.html <<'EOF'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <meta name="viewport" content="width=device-width, initial-scale=1" />
              <title>Playwright Report</title>
            </head>
            <body>
              <h1>Playwright Report</h1>
              <p>No HTML report was generated for this run.</p>
            </body>
          </html>
          EOF
          fi
      - name: Upload Playwright report artifact
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  publish:
    needs: test
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository (for the index generator script)
        uses: actions/checkout@v4
      - name: Download Playwright report artifact
        uses: actions/download-artifact@v4
        with:
          name: playwright-report
          path: new-report
      - name: Publish report to gh-pages branch
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Sortable, traceable folder name: date_run-number(padded)_short-sha
          RUN_NUM=$(printf "%06d" "${{ github.run_number }}")
          SHORT_SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          RUN_DIR="$(date -u +%Y-%m-%d)_${RUN_NUM}_${SHORT_SHA}"

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          REMOTE="https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"

          # Clone the existing gh-pages branch, or start a fresh orphan branch.
          rm -rf gh-pages
          if git ls-remote --exit-code --heads "$REMOTE" gh-pages >/dev/null 2>&1; then
            git clone --branch gh-pages --single-branch "$REMOTE" gh-pages
          else
            git clone "$REMOTE" gh-pages
            cd gh-pages
            git checkout --orphan gh-pages
            git rm -rf . >/dev/null 2>&1 || true
            cd ..
          fi

          # Drop this run's report into its own folder.
          mkdir -p "gh-pages/runs/${RUN_DIR}"
          cp -r new-report/. "gh-pages/runs/${RUN_DIR}/"

          # Prune to the most recent 20 runs (oldest folders removed).
          cd gh-pages/runs
          ls -1 | sort | head -n -20 | while read -r old; do
            echo "Pruning old report: $old"
            rm -rf "$old"
          done
          cd ../..

          # Regenerate the dashboard index and disable Jekyll processing.
          node scripts/generate-report-index.mjs gh-pages
          touch gh-pages/.nojekyll

          cd gh-pages
          git add -A
          git commit -m "Report for run #${{ github.run_number }} (${RUN_DIR})" || echo "Nothing to commit"
          git push origin gh-pages